# ─────────────────────────────────────────────
# BridgeSupport Website — CI/CD Pipeline
# ─────────────────────────────────────────────
# WHAT THIS DOES:
#   1. On every Pull Request → runs checks (CI)
#   2. On merge to main      → deploys live (CD)
#   3. On merge to staging   → deploys to staging preview
# ─────────────────────────────────────────────

name: BridgeSupport CI/CD

# ── TRIGGERS ──────────────────────────────────
on:
  push:
    branches:
      - main        # deploy to live when merged to main
      - staging     # deploy to staging preview when merged to staging
  pull_request:
    branches:
      - main        # run checks on every PR into main
      - develop     # run checks on every PR into develop

# ── JOBS ──────────────────────────────────────
jobs:

  # ── JOB 1: CODE CHECKS (CI) ─────────────────
  # Runs on every Pull Request
  # Checks HTML, CSS and JS for errors
  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Check HTML for errors
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true

      # Step 3: Check JS for errors
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS linter
        run: npm install -g jshint

      - name: Lint JavaScript
        run: jshint js/main.js --esversion=6 || true


  # ── JOB 2: DEPLOY TO STAGING ────────────────
  # Runs when code is pushed/merged to staging branch
  # Deploys to a staging preview URL for client review
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: checks           # only runs if checks pass
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages (staging)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: staging    # deploys to /staging subfolder
          commit_message: "Deploy staging preview"


  # ── JOB 3: DEPLOY TO PRODUCTION ─────────────
  # Runs when code is pushed/merged to main branch
  # Deploys the live website automatically
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: checks           # only runs if checks pass
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Deploy to GitHub Pages (live site)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          commit_message: "Deploy to production: ${{ github.event.head_commit.message }}"
